[package]
name = "mapper-spike"
version = "0.0.1"
description = "Mapper spike S-1..S-3: overlay window, own RegisterHotKey wrapper, focus without set_focus"
edition = "2021"
publish = false

[[bin]]
name = "mapper-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same version tauri uses; only for WebView2 visibility / memory-level calls (S-3).
webview2-com = "0.39"

# Same major as tao/wry use, so it is compiled once. Features are the minimum the
# hotkey thread, focus handling and window styling need; anything touching other
# processes, screen capture or input injection is banned by deny.toml.
[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
