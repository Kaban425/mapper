# Dependency half of the anti-ban guard (plan/eng.md §7.8). Run from the repository root:
#   cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
# scripts/antiban-guard.mjs reads the [bans] deny list below too, so it is the only copy.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Vulnerabilities always fail. "Unmaintained" fails only for Mapper's own direct dependencies
# (eng §7.8): an unmaintained crate deep in Tauri's tree is no ban risk and is Tauri's to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# Only what the graph needs; dual-licensed crates pass through MIT or Apache-2.0.
# MPL-2.0 (file-level copyleft) comes from cssparser, selectors, dtoa-short and option-ext:
# their sources stay unmodified and available on crates.io, which satisfies it in an MIT app.
# ISC (ring, rustls-webpki, untrusted: MIT-like) and CDLA-Permissive-2.0 (webpki-roots: the root
# certificate data) come with the update check's TLS (Phase 4).
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
  # input injection, hooks, keyboard polling
  { crate = "enigo", reason = "input injection" },
  { crate = "rdev", reason = "global input hooks" },
  { crate = "inputbot", reason = "input hooks and injection" },
  { crate = "device_query", reason = "keyboard polling" },
  { crate = "winput", reason = "input injection" },
  { crate = "autopilot", reason = "input injection" },
  { crate = "rustautogui", reason = "input injection and screen capture" },
  { crate = "mouce", reason = "input injection" },
  { crate = "livesplit-hotkey", reason = "low-level keyboard hook" },
  { crate = "win-hotkeys", reason = "low-level keyboard hook" },
  { crate = "willhook", reason = "low-level hooks" },
  { crate = "multiinput", reason = "raw input" },
  { crate = "global-hotkey", reason = "polls GetAsyncKeyState; Mapper uses its own RegisterHotKey wrapper" },
  # screen capture
  { crate = "xcap", reason = "screen capture" },
  { crate = "screenshots", reason = "screen capture" },
  { crate = "scrap", reason = "screen capture" },
  { crate = "captrs", reason = "screen capture" },
  { crate = "dxgcap", reason = "screen capture" },
  { crate = "win-screenshot", reason = "screen capture" },
  { crate = "windows-capture", reason = "screen capture" },
  { crate = "uiautomation", reason = "reads names, classes and processes of other programs' windows" },
  # other processes, memory, code injection
  { crate = "sysinfo", reason = "process enumeration" },
  { crate = "process-memory", reason = "reads other processes" },
  { crate = "read-process-memory", reason = "reads other processes" },
  { crate = "memflow", reason = "reads other processes" },
  { crate = "dll-syringe", reason = "DLL injection" },
  { crate = "retour", reason = "function hooking" },
  { crate = "minhook", reason = "function hooking" },
  { crate = "libloading", reason = "dynamic loading of arbitrary functions" },
  # plugins that bring forbidden calls or broad access
  { crate = "tauri-plugin-shell", reason = "arbitrary process spawning" },
  { crate = "tauri-plugin-opener", reason = "opens arbitrary paths and URLs; Mapper opens only its own folders" },
  { crate = "tauri-plugin-single-instance", reason = "uses FindWindowW and GetWindowThreadProcessId" },
  { crate = "tauri-plugin-global-shortcut", reason = "built on global-hotkey" },
  { crate = "tauri-plugin-fs", reason = "file access from the web view" },
  { crate = "tauri-plugin-process", reason = "restart and exit from the web view" },
  { crate = "tauri-plugin-autostart", reason = "built on auto-launch; Mapper writes its own HKCU Run value" },
  { crate = "auto-launch", reason = "Mapper writes its own HKCU Run value" },
  # network: the only network code is the update check in src-tauri/src/update (ureq)
  { crate = "reqwest", reason = "the update check uses ureq; one HTTP client only" },
  { crate = "tauri-plugin-http", reason = "network access from the web view" },
  { crate = "tauri-plugin-updater", reason = "Mapper only links to new releases, it never downloads them" },
]

# Feature unification spans the whole graph, so these also catch a dependency that
# quietly enables them.
# The exact unified feature set of `windows` (Mapper's own plus tao, wry, muda, tray-icon,
# webview2-com, window-vibrancy). Safe Rust reaches WinRT through features alone (InputInjector,
# ProcessDiagnosticInfo), so any newly enabled feature fails, whoever enables it; a dependency
# update means re-auditing this list (security review, Phase 1).
[[bans.features]]
crate = "windows"
exact = true
allow = [
  "Win32", "Win32_Devices", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Globalization",
  "Win32_Graphics", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WindowsProgramming",
  "Win32_UI", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input",
  "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Input_Touch",
  "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging", "default", "std",
]

[[bans.features]]
crate = "windows-sys"
deny = [
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Magnification",
]

# Run-time capabilities would bypass the per-window ACL files (the guard checks Cargo.toml too).
[[bans.features]]
crate = "tauri"
deny = ["dynamic-acl", "devtools"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
