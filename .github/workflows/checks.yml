name: checks

on:
  workflow_call:
    inputs:
      release:
        description: Release build: no npm or Rust caches, so nothing restored from a cache reaches the shipped exe.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build scripts and npm tools never see the job token.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain
      - if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny@0.20.2
      # The guard runs first and through node, not npm: an npm "pre*" hook added by a PR
      # would otherwise run before the guard could reject it.
      - run: node scripts/antiban-guard.mjs
      - run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      # Overlay and HUD against the mock transport, in the runner's Microsoft Edge (no download).
      - run: npm run e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npx tauri build --no-bundle
      - run: node scripts/antiban-guard.mjs --exe auto
